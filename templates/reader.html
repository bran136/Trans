<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#dfe4fb">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>在线读书</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="{{ asset_url('site-icon.svg') }}">
    <link rel="manifest" href="{{ asset_url('site.webmanifest') }}">
    <script src="{{ asset_url('reader-theme.js') }}"></script>
    <link rel="stylesheet" href="{{ asset_url('reader.css') }}">
    <link rel="stylesheet" href="{{ asset_url('ui.css') }}">
  </head>
  <body class="reader-body" data-media-artwork-url="{{ asset_url('media-artwork.png') }}">
    <div class="reader-shell">
      <header class="reader-topbar">
        <div>
          <h1>在线读书</h1>
          <span id="readerStatus">本地书架</span>
        </div>
        <nav class="reader-actions">
          <a href="/">主页</a>
          <button id="statisticsBtn" type="button">统计</button>
          <button id="shelfBtn" type="button" hidden>书架</button>
          <button id="manageBtn" type="button">管理</button>
          <button id="ttsBtn" type="button">听书</button>
          <button id="settingsBtn" type="button">设置</button>
          <button id="logoutBtn" type="button">退出</button>
        </nav>
      </header>

      <main class="reader-stage">
        <section id="shelfView" class="shelf-view">
          <div class="shelf-head">
            <div>
              <h2>我的书架</h2>
              <span id="bookCount">0 本</span>
            </div>
          </div>
          <div id="bookList" class="book-list"></div>
        </section>

        <section id="readingView" class="reading-view" hidden>
          <div class="reader-toolbar">
            <button id="prevChapterBtn" type="button">上一章</button>
            <button id="chapterSelectBtn" class="chapter-select-btn" type="button" aria-haspopup="dialog">
              <span id="chapterSelectLabel">选择章节</span>
            </button>
            <button id="nextChapterBtn" type="button">下一章</button>
          </div>
          <div id="listenToolbar" class="listen-toolbar" hidden>
            <button id="listenPauseBtn" type="button">暂停</button>
            <button id="listenStopBtn" type="button">停止</button>
            <select id="playbackRateSelect" aria-label="播放倍速">
              <option value="0.8">0.8x</option>
              <option value="1" selected>1.0x</option>
              <option value="1.2">1.2x</option>
              <option value="1.5">1.5x</option>
              <option value="2">2.0x</option>
            </select>
            <select id="quickVoiceSelect" aria-label="听书音色"></select>
            <button id="sleepTimerBtn" class="sleep-timer-btn" type="button">定时</button>
            <span id="listenStatus">点击句子可从该句开始读</span>
          </div>
          <article id="bookContent" class="book-content empty">选择一本书开始阅读</article>
        </section>
      </main>
    </div>

    <dialog id="chapterSelectDialog" class="reader-dialog chapter-select-dialog">
      <section class="dialog-panel">
        <div class="dialog-head">
          <h2>选择章节</h2>
          <button id="closeChapterSelectBtn" type="button">关闭</button>
        </div>
        <div id="chapterSelectList" class="chapter-select-list" role="listbox" aria-label="章节列表"></div>
      </section>
    </dialog>

    <dialog id="manageDialog" class="reader-dialog manage-dialog">
      <section class="dialog-panel">
        <div class="dialog-head">
          <h2>书籍管理</h2>
          <button id="closeManageBtn" type="button">关闭</button>
        </div>
        <div class="manage-layout">
          <section class="manage-upload">
            <form id="uploadForm" class="upload-box">
              <input id="bookFile" name="book" type="file" accept=".txt,.epub,.pdf">
              <label class="upload-drop" for="bookFile">
                <strong>导入本地书</strong>
                <span id="selectedFileName">TXT / EPUB / PDF，最大 50MB</span>
              </label>
              <div id="uploadProgress" class="upload-progress" hidden>
                <div id="uploadProgressBar"></div>
              </div>
              <div id="uploadMessage" class="upload-message">选择文件后导入到本地书架</div>
              <div id="importJobs" class="import-jobs" hidden></div>
            </form>
          </section>
          <section>
            <div id="manageBookList" class="manage-book-list"></div>
          </section>
        </div>
      </section>
    </dialog>

    <div id="deleteBookConfirmDialog" class="action-confirm-overlay" role="dialog" aria-modal="true" aria-labelledby="deleteBookConfirmTitle" aria-describedby="deleteBookConfirmMessage" hidden>
      <section class="dialog-panel">
        <div class="dialog-head">
          <h2 id="deleteBookConfirmTitle">删除书籍</h2>
          <div class="dialog-actions">
            <button id="cancelDeleteBookBtn" type="button">取消</button>
            <button id="confirmDeleteBookBtn" class="dialog-confirm-btn danger" type="button">确认删除</button>
          </div>
        </div>
        <p id="deleteBookConfirmMessage" class="reader-config-message compact-confirm-message"></p>
      </section>
    </div>

    <dialog id="statisticsDialog" class="reader-dialog statistics-dialog">
      <section class="dialog-panel">
        <div class="dialog-head">
          <h2>阅读统计</h2>
          <button id="closeStatisticsBtn" type="button">关闭</button>
        </div>
        <div id="statisticsSummary" class="statistics-summary"></div>
        <div id="statisticsList" class="statistics-list"></div>
      </section>
    </dialog>

    <dialog id="bookMetadataDialog" class="reader-dialog book-metadata-dialog">
      <form id="bookMetadataForm" class="dialog-panel">
        <div class="dialog-head">
          <h2>编辑书籍</h2>
          <div class="dialog-actions">
            <button id="saveBookMetadataBtn" type="submit">保存</button>
            <button id="closeBookMetadataBtn" type="button">关闭</button>
          </div>
        </div>
        <div id="bookMetadataMessage" class="reader-config-message" hidden></div>
        <label class="book-metadata-field">书名
          <input id="bookTitleInput" type="text" maxlength="160" autocomplete="off" required>
        </label>
        <label class="book-metadata-field">作者
          <input id="bookAuthorInput" type="text" maxlength="120" autocomplete="off" placeholder="作者未知">
        </label>
      </form>
    </dialog>

    <dialog id="tocEditDialog" class="reader-dialog toc-edit-dialog">
      <section class="dialog-panel">
        <div class="dialog-head">
          <h2 id="tocEditTitle">目录</h2>
          <button id="closeTocEditBtn" type="button">关闭</button>
        </div>
        <div id="tocEditMessage" class="reader-config-message" hidden></div>
        <div id="tocEditList" class="toc-edit-list"></div>
      </section>
    </dialog>

    <dialog id="tocLineDialog" class="reader-dialog toc-line-dialog">
      <section class="dialog-panel">
        <div class="dialog-head">
          <h2>选择标题行</h2>
          <button id="closeTocLineBtn" type="button">关闭</button>
        </div>
        <input id="tocLineSearch" class="toc-line-search" type="search" placeholder="搜索这一章里的行">
        <div id="tocLineMessage" class="reader-config-message" hidden></div>
        <div id="tocLineList" class="toc-line-list"></div>
      </section>
    </dialog>

    <div id="actionConfirmDialog" class="action-confirm-overlay" role="dialog" aria-modal="true" aria-labelledby="actionConfirmTitle" aria-describedby="actionConfirmMessage" hidden>
      <section class="dialog-panel">
        <div class="dialog-head">
          <h2 id="actionConfirmTitle">确认操作</h2>
          <div class="dialog-actions">
            <button id="cancelActionConfirmBtn" type="button">取消</button>
            <button id="confirmActionConfirmBtn" class="dialog-confirm-btn" type="button">确认</button>
          </div>
        </div>
        <p id="actionConfirmMessage" class="reader-config-message compact-confirm-message"></p>
      </section>
    </div>

    <dialog id="settingsDialog" class="reader-dialog settings-dialog">
      <section class="dialog-panel">
        <div class="dialog-head">
          <h2>阅读设置</h2>
          <div class="dialog-actions">
            <button id="darkModeBtn" class="theme-mode-btn" type="button" aria-pressed="false">黑暗</button>
            <button id="closeSettingsBtn" type="button">关闭</button>
          </div>
        </div>
        <label class="setting-row">
          字号 <span id="fontValue">18</span>
          <input id="fontInput" type="range" min="15" max="24" step="1" value="18">
        </label>
        <label class="setting-row">
          字体
          <div id="fontPicker" class="font-picker" role="group" aria-label="选择阅读字体"></div>
        </label>
      </section>
    </dialog>

    <dialog id="ttsDialog" class="reader-dialog tts-dialog">
      <section class="dialog-panel">
        <div class="dialog-head">
          <h2>听书</h2>
          <div class="dialog-actions">
            <button id="saveTtsConfigBtn" type="button">保存</button>
            <button id="closeTtsBtn" type="button">关闭</button>
          </div>
        </div>
        <section class="tts-config-panel">
          <div id="ttsConfigMessage" class="reader-config-message" hidden></div>
          <div id="mimoBalancePanel" class="mimo-balance-panel" hidden>
            <div id="mimoBalance" class="mimo-balance"></div>
            <div class="mimo-balance-actions">
              <button id="configureMimoCookieBtn" type="button">配置Cookie</button>
              <a href="https://platform.xiaomimimo.com/console/balance" target="_blank" rel="noopener noreferrer">MiMo控制台</a>
              <button id="refreshMimoBalanceBtn" type="button">重新查询</button>
            </div>
          </div>
          <label class="setting-check"><input id="ttsEnabled" type="checkbox"> 启用 Xiaomi MiMo 听书</label>
          <div class="tts-settings-grid">
            <label>API Key
              <input id="ttsApiKey" type="password" autocomplete="off">
            </label>
            <label>接口地址
              <input id="ttsBaseUrl" type="url" disabled aria-disabled="true">
            </label>
            <label>模型
              <select id="ttsModel"></select>
            </label>
            <label>音色
              <select id="ttsVoiceId"></select>
            </label>
            <label>单句字符
              <input id="ttsChunkChars" type="number" min="80" max="800" step="10">
            </label>
            <label class="tts-wide">风格 / 音色描述
              <textarea id="ttsStylePrompt" rows="1"></textarea>
            </label>
          </div>
          <div class="tts-cache-row">
            <label class="setting-check"><input id="ttsCacheEnabled" type="checkbox"> 复用服务端单句缓存</label>
            <span id="ttsCacheStats" class="tts-cache-stats"></span>
          </div>
        </section>
      </section>
    </dialog>

    <dialog id="offlineCacheDialog" class="reader-dialog offline-cache-dialog">
      <section class="dialog-panel">
        <div class="dialog-head">
          <h2>离线听书缓存</h2>
          <div class="dialog-actions">
            <button id="closeOfflineCacheBtn" type="button">返回管理</button>
          </div>
        </div>
        <p id="offlineCacheSummary" class="offline-cache-summary">请选择一本书后管理离线音频。</p>
        <div class="offline-cache-presets">
          <button id="selectAllOfflineBtn" type="button">全选</button>
          <button id="selectRangeOfflineBtn" type="button">选择范围</button>
          <button id="clearOfflineSelectionBtn" type="button">清除选择</button>
        </div>
        <div id="offlineCacheProgress" class="offline-cache-progress" role="status" aria-live="polite" aria-hidden="true">
          <span id="offlineCacheProgressText" class="offline-cache-progress-text"></span>
          <button id="retryOfflineJobBtn" class="offline-cache-retry" type="button" hidden>重试</button>
          <button id="cancelOfflineJobBtn" class="offline-cache-cancel" type="button" hidden>取消</button>
        </div>
        <div id="offlineChapterList" class="offline-chapter-list"></div>
        <div class="offline-cache-actions">
          <button id="cacheServerOfflineBtn" type="button">服务器固定</button>
          <button id="cacheAndDownloadOfflineBtn" type="button">固定并下载到本地</button>
          <button id="deleteLocalOfflineBtn" type="button">删除本地缓存</button>
          <button id="unpinServerOfflineBtn" class="danger" type="button">取消服务器固定</button>
        </div>
        <p class="offline-cache-help">优先播放本机缓存；服务器缓存固定后不会自动清理。</p>
      </section>
    </dialog>

    <dialog id="offlineRangeDialog" class="reader-dialog offline-range-dialog">
      <form id="offlineRangeForm" class="dialog-panel" novalidate>
        <div class="dialog-head">
          <h2>选择章节范围</h2>
          <div class="dialog-actions">
            <button type="submit">确定</button>
            <button id="closeOfflineRangeBtn" type="button">取消</button>
          </div>
        </div>
        <div id="offlineRangeMessage" class="reader-config-message" role="alert" hidden></div>
        <div class="offline-range-fields">
          <label class="offline-range-field">起始章节
            <input id="offlineRangeStart" type="number" min="1" step="1" inputmode="numeric" required>
          </label>
          <label class="offline-range-field">结束章节
            <input id="offlineRangeEnd" type="number" min="1" step="1" inputmode="numeric" required>
          </label>
        </div>
      </form>
    </dialog>

    <dialog id="mimoCookieDialog" class="reader-dialog mimo-cookie-dialog">
      <section class="dialog-panel">
        <div class="dialog-head">
          <h2>配置 MiMo Cookie</h2>
          <div class="dialog-actions">
            <button id="saveMimoCookieBtn" type="button">保存</button>
            <button id="closeMimoCookieBtn" type="button">关闭</button>
          </div>
        </div>
        <div id="mimoCookieMessage" class="reader-config-message" hidden></div>
        <label class="mimo-cookie-field">Cookie
          <textarea id="mimoBalanceCookieInput" rows="5" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
        </label>
        <p class="mimo-cookie-help">可以粘贴完整 Cookie；服务端只保存 MiMo 余额查询需要的白名单字段。</p>
      </section>
    </dialog>

    <dialog id="sleepTimerDialog" class="reader-dialog sleep-dialog">
      <section class="dialog-panel">
        <div class="dialog-head">
          <h2>定时暂停</h2>
          <div class="dialog-actions">
            <button id="closeSleepTimerBtn" type="button">关闭</button>
          </div>
        </div>
        <section class="sleep-panel">
          <div class="sleep-options">
            <button type="button" data-sleep-minutes="5">5 分钟</button>
            <button type="button" data-sleep-minutes="10">10 分钟</button>
            <button type="button" data-sleep-minutes="15">15 分钟</button>
            <button type="button" data-sleep-minutes="30">30 分钟</button>
            <button type="button" data-sleep-minutes="45">45 分钟</button>
            <button type="button" data-sleep-minutes="60">60 分钟</button>
          </div>
          <label class="sleep-custom">自定义分钟
            <input id="sleepCustomMinutes" type="number" min="1" max="480" step="1" inputmode="numeric" placeholder="例如 25">
          </label>
          <div class="sleep-actions">
            <button id="applySleepCustomBtn" type="button">应用</button>
            <button id="clearSleepTimerBtn" type="button">取消定时</button>
          </div>
        </section>
      </section>
    </dialog>

    <div class="reader-version">
      <span>v{{ app_version() }}</span>
      <a class="version-github-link" href="https://github.com/bran136/Trans" target="_blank" rel="noopener noreferrer" aria-label="在 GitHub 查看 Trans" title="在 GitHub 查看项目">
        <img src="{{ asset_url('github-mark.svg') }}" alt="" aria-hidden="true">
      </a>
    </div>
    <script src="{{ asset_url('ui.js') }}"></script>
    <script src="{{ asset_url('font-cache.js') }}"></script>
    <script src="{{ asset_url('reader.js') }}"></script>
  </body>
</html>
